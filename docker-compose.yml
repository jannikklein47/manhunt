# Manhunt — production deployment.
#
# Everything is served from ONE origin:
#   frontend  https://batterysync.de:4000/           (nginx + TLS, SPA)
#   backend   https://batterysync.de:4000/backend/   (proxied to the game server)
#
# nginx terminates TLS using the certificate pair from
# /home/ubuntu/ssl/batterysync/ on the host (mounted read-only) and proxies
# /backend/ to the game server container over the internal network — the
# backend itself is NOT published to the host.
# Expected file names (configurable below): fullchain.pem / privkey.pem
#
# Usage on the server:
#   docker compose up -d --build

name: manhunt

networks:
  # External-facing network: nginx publishes its TLS port here and proxies
  # to the backend over it.
  web:
  # Database island: `internal: true` — Docker gives this network NO route
  # to the outside world. The DB is unreachable from the host, the internet
  # and even its containers cannot dial out; only backend ↔ db inside it.
  db-internal:
    internal: true

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Match replay storage (event log). Fully isolated: no published port
    # AND no external route (db-internal is an internal-only network) —
    # only the game server can open a connection to it.
    environment:
      POSTGRES_USER: manhunt
      POSTGRES_PASSWORD: manhunt
      POSTGRES_DB: manhunt
    volumes:
      - manhunt-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U manhunt -d manhunt']
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - db-internal

  backend:
    build: ./backend
    image: manhunt-backend
    restart: unless-stopped
    # Internal only — reachable through nginx (/backend/), no host port.
    expose:
      - '3001'
    environment:
      PORT: 3001
      # Replay recording: the backend writes the match event log here
      # (schema is created automatically on boot).
      DATABASE_URL: postgres://manhunt:manhunt@db:5432/manhunt
    depends_on:
      db:
        condition: service_healthy
    networks:
      # web: so the nginx frontend can proxy /backend/ to this container.
      # db-internal: the ONLY way to the database.
      - web
      - db-internal

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the SPA at build time — the browser talks to the same
        # nginx origin, with the game server mounted under /backend.
        VITE_SOCKET_URL: https://batterysync.de:4000/backend
    image: manhunt-frontend
    restart: unless-stopped
    environment:
      # --- SSL certificate reader (nginx template) ------------------------
      SSL_DIR: /etc/manhunt/ssl
      SSL_CERT: fullchain.pem
      SSL_KEY: privkey.pem
      SERVER_NAME: batterysync.de
    ports:
      - '4000:443'
    volumes:
      - /home/ubuntu/ssl/batterysync:/etc/manhunt/ssl:ro
    networks:
      - web

volumes:
  manhunt-pgdata:
